<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMARTSTOCK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container" id="loginPage">
<div class="login-box">
<h1>SMARTSTOCK</h1>
<p>Inventory & Billing Management System</p>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<button onclick="showSignup()">SIGN UP</button>
<p id="error"></p>
</div></div>
<div id="signupPage" style="display:none">
<h1>Create Account</h1>
<input id="newUsername" placeholder="Username">
<input type="password" id="newPassword" placeholder="Password">
<input type="password" id="confirmPassword" placeholder="Confirm Password">
<button onclick="signup()">CREATE ACCOUNT</button>
<button onclick="showLogin()">BACK TO LOGIN</button>
<p id="signupError"></p></div>
<div class="dashboard" id="dashboardPage">
<header><h1>SMARTSTOCK</h1><button onclick="logout()">Logout</button></header>
<aside><button onclick="showDashboard()">Dashboard</button><button onclick="showProducts()">Products</button><button onclick="showStock()">Stock</button><button onclick="showBilling()">Billing</button><button onclick="showReports()">Sales Reports</button></aside>
<main><section id="dashboardSection"><h2>Dashboard</h2><p>Total Products: <strong id="totalProducts">0</strong></p><p>Total Stock: <strong id="totalStock">0</strong></p><p>Today's Sales: <strong id="todaySales">Rs. 0</strong></p></section>
<section id="productsSection" class="hidden"><h2>Products</h2><input id="productName" placeholder="Product Name"><input id="productPrice" type="number" placeholder="Price"><input id="productQuantity" type="number" placeholder="Quantity"><button onclick="addProduct()">Add Product</button><table><tbody id="productTable"></tbody></table></section>
<section id="stockSection" class="hidden"><h2>Stock</h2><table><tbody id="stockTable"></tbody></table></section>
<section id="billingSection" class="hidden"><h2>Billing</h2><input id="customerName" placeholder="Customer Name"><input id="billProduct" placeholder="Product Name"><input id="billQuantity" type="number" placeholder="Quantity"><button onclick="createBill()">Create Bill</button><div id="billResult"></div></section>
<section id="reportsSection" class="hidden"><h2>Sales Reports</h2><p id="salesReport">Rs. 0</p><table><tbody id="salesHistory"></tbody></table></section></main></div>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.0.0/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body></html>
